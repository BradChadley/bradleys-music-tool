[package]
name = "bradleys-music-tool"
version = "1.0.0"
edition = "2024"

[dependencies]
# The lighter OpenGL backend ("glow") instead of the default wgpu one: same picture, much less memory at rest.
eframe = { version = "0.37.0", default-features = false, features = ["persistence", "glow", "accesskit", "clipboard", "default_fonts", "links", "system_fonts"] }
egui = "0.37.0"
egui_extras = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", features = ["json"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "ico"] }
md5 = "0.7"
trash = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Globalization"] }
dirs = "7.0.0"
chrono = "0.4.45"
open = "5.4.5"
crossbeam-channel = "0.5.17"
regex = "1"
rfd = "0.18.0"
# unpacking the helpers the app fetches for itself (see helpers.rs): zip archives, with the deflate it already has
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
# the program file's icon, name and version (see build.rs)
winresource = "0.1.34"

[profile.release]
opt-level = 3
